name: Update channels

on:
  # Sent by k0sproject/k0s when a release is published (see README)
  repository_dispatch:
    types: [k0s-release]
  # Fallback if a dispatch is missed; no-op when nothing changed
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-channels
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate channel files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update-channels.py

      - name: Open / update PR
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-channels
          delete-branch: true
          commit-message: "Update channels${{ github.event.client_payload.version && format(' for {0}', github.event.client_payload.version) || '' }}"
          title: "Update channels${{ github.event.client_payload.version && format(' for {0}', github.event.client_payload.version) || '' }}"
          body: |
            Generated by `scripts/update-channels.py` from published k0s releases and their `sha256sums.txt`.
            Trigger: `${{ github.event_name }}`
          labels: automated

      # Uncomment to publish without review:
      # - if: steps.pr.outputs.pull-request-number
      #   env:
      #     GH_TOKEN: ${{ github.token }}
      #   run: gh pr merge --squash --auto "${{ steps.pr.outputs.pull-request-number }}"
